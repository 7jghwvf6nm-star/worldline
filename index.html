.ws-free-action{background:#131626;border:1px solid #4c416c;border-radius:16px;padding:21px;margin-top:23px}
.ws-free-action>b{font-size:17px;color:#eadbff}
.ws-free-action>p{font-size:12px;color:#b9b2c7;line-height:1.8}
.ws-free-action textarea{min-height:140px;font-size:16px}
.ws-causality{margin-top:25px;padding:15px 18px;background:rgba(173,152,233,.07);border-left:3px solid #b49af2;border-radius:8px}
.ws-causality b{font-size:13px;color:#e1d4ff}.ws-causality ul{margin-bottom:0;padding-left:18px;color:#cbc8d7;font-size:13px;line-height:1.9}
.ws-illustration-section{margin-top:25px;padding:18px;border:1px solid #514261;border-radius:17px;background:#151727}
.ws-ill-head{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap}.ws-ill-head strong{font-size:16px}.ws-ill-head p{font-size:12px;color:#b0aabb}
.ws-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin:16px 0}.ws-art{min-width:0;margin:0}.ws-art img{display:block;width:100%;aspect-ratio:2 / 3;object-fit:cover;background:linear-gradient(160deg,#3b3354,#1a1d2b);border-radius:12px}.ws-art figcaption{font-size:11px;line-height:1.7;color:#b7b5c4;margin-top:7px}.ws-link{border:0;background:transparent;color:#d4bdff;text-decoration:underline;cursor:pointer}
.ws-play-card{padding:24px}.ws-hero{background:radial-gradient(600px 270px at 75% 20%,rgba(219,165,198,.12),transparent 80%),linear-gradient(120deg,#25203d,#141a2b)}
@media(max-width:960px){.ws-play{grid-template-columns:1fr}}
@media(max-width:560px){.ws-ill-head .btn{width:100%}.ws-free-action{padding:14px}.ws-play-card{padding:15px}.ws-gallery{grid-template-columns:1fr}}

/* ChatGPT bridge */
.ws-bridge-import {margin-top:17px; padding:19px; border:1px solid rgba(195,167,255,.25); background:linear-gradient(140deg,#221c38,#161724);border-radius:17px;}
.ws-bridge-import h3{font-size:17px;margin:0 0 6px;}
.ws-bridge-import p{font-size:12px;}
.ws-illustration-section .ws-actions{flex-wrap:wrap;max-width:100%;}
.ws-illustration-section .btn {white-space:normal;text-align:center;}
@media(max-width:760px){.ws-bridge-import{padding:13px}.ws-illustration-section .ws-actions{width:100%;}.ws-illustration-section .ws-actions>.btn{flex:1 1 135px;}}

<body>
<div id="app" class="app"></div>
<script>
'use strict';
const STORAGE='worldline_app_v1';
const MEDIA={novel:'📖 소설',anime:'✦ 애니',game:'🎮 게임',drama:'🎬 드라마'};
const STAT={bond:'유대',insight:'진실',flux:'변수'};
const baseWorlds=[
{id:'crown',media:'novel',emoji:'♛',title:'무너진 왕관',subtitle:'왕녀가 사라진 밤, 역사를 바꿀 한 사람',genre:'궁정 판타지',shade:'#30213b',glow:'rgba(219,150,255,.35)',ally:'리안',place:'월식의 왕궁',artifact:'은빛 왕관',opponent:'섭정 레온',crisis:'왕위 계승의 진실',intro:'왕궁이 무너진 날, 당신은 기록에 없는 한 장의 편지를 받는다. 왕녀는 죽지 않았다. 다만 다음 새벽이 오기 전에 그녀를 찾아야 한다.',scenes:[
{title:'기록되지 않은 밤',body:'월식이 시작된 밤, {{place}}의 시계가 모두 멈춘다. 신분을 숨긴 시종 {{ally}}은 당신을 폐쇄된 회랑으로 이끈다. 문 너머에서 {{opponent}}의 목소리가 들린다.\n\n“내일 아침, 새로운 역사가 발표될 것이다.”\n\n그 역사가 진실인지 거짓인지는 아직 아무도 모른다.',quote:'“왕관이 왕을 만드는 게 아니라, 왕이 무엇을 선택했는지가 왕관을 바꾸죠.”',choices:[['{{ally}}을 믿고 함께 잠입한다.','동료를 얻지만 누군가 당신을 목격한다.',{bond:2,flux:1},'{{ally}}은 당신에게 비밀통로의 열쇠를 건넨다.','bond'],['왕실 기록 보관소부터 조사한다.','진실에 접근하지만 시간이 부족해진다.',{insight:2,flux:1},'오래된 장부에서 지워진 이름 하나를 발견한다.','insight'],['섭정에게 직접 모습을 드러낸다.','권력과 정면으로 거래한다.',{flux:3},'{{opponent}}의 눈빛이 바뀐다. 이제 그는 당신을 기억한다.','flux']]},
{title:'숨겨진 계승자',body:'이틀 전 사라진 왕녀의 행방이 드러난다. {{ally}}은 왕녀가 왕좌보다 백성의 안전을 먼저 원했다고 말한다. 하지만 광장에는 이미 다른 왕을 환영하는 깃발이 펄럭인다.',quote:'“살아 있다는 사실만으로는 아무것도 되찾을 수 없어요.”',choices:[['왕녀를 보호할 동료들을 모은다.','서로 믿을 사람을 늘린다.',{bond:2},'소수의 경비병이 서약을 깨고 당신의 편에 선다.','bond'],['왕위 계승 문서를 공개한다.','대중에게 근거를 제시한다.',{insight:2,flux:1},'봉인된 문서가 광장 전체에 퍼진다.','insight'],['즉위식을 앞당겨 혼란을 유도한다.','긴박한 변화를 만든다.',{flux:3},'궁정은 당황하고, 모든 계획이 새 시간표에 맞춰 움직인다.','flux']]},
{title:'거짓 맹세',body:'예상하지 못한 편지가 도착한다. {{opponent}}은 단 한 번의 협상을 제안한다. 자리에 나가면 진실을 얻을 수도 있고, 되돌릴 수 없는 약속을 하게 될 수도 있다.',quote:'“아무런 대가가 없는 약속이 가장 위험하지.”',choices:[['{{ally}}과 함께 협상장에 간다.','함께 위험을 나눈다.',{bond:2,insight:1},'{{ally}}은 침묵 속에서 당신의 말을 지지한다.','bond'],['상대의 거짓말을 입증할 증거를 준비한다.','사실을 무기로 삼는다.',{insight:3},'상대가 감춘 약점을 알아낸다.','insight'],['협상장을 떠나 직접 왕궁의 종을 울린다.','예상 밖 행동으로 판도를 흔든다.',{flux:3},'모두의 시선이 단번에 당신에게 쏠린다.','flux']]},
{title:'왕좌의 대가',body:'성문 밖에 사람들이 모인다. 누구는 즉각적인 변화만을, 누구는 안정만을 원한다. {{artifact}}을 들어 올리는 순간, 당신의 결정은 더 이상 비밀이 될 수 없다.',quote:'“백성에게 필요한 건 새로운 거짓말이 아니에요.”',choices:[['왕녀와 시민들의 공개 회의를 연다.','서로의 목소리를 묶는다.',{bond:2,insight:1},'처음으로 궁정의 문이 모두에게 열린다.','bond'],['왕실의 잘못을 먼저 인정한다.','불편한 사실을 드러낸다.',{insight:3},'침묵하던 사람들도 증언을 시작한다.','insight'],['왕관을 즉위식장에 남겨둔 채 떠난다.','예정된 결말을 완전히 흔든다.',{flux:3},'왕좌는 비어 있고, 사람들은 처음으로 자신의 선택을 생각한다.','flux']]},
{title:'새벽의 서약',body:'마침내 월식이 끝나 간다. {{ally}}은 당신에게 마지막 결정을 맡긴다. 원래의 역사책에는 오늘 밤 한 명만 영웅으로 기록되어 있었다. 하지만 당신이 걸어온 길 때문에 그 문장은 이미 달라졌다.',quote:'“이야기의 끝은 누가 왕이 되는지가 아니라, 내일 무엇이 남는지예요.”',choices:[['모든 사람과 함께 새 질서를 세운다.','신뢰를 바탕으로 새 출발을 택한다.',{bond:3},'왕궁의 계단에 여러 사람의 발자국이 남는다.','bond'],['진실을 기록하고 누구에게나 공개한다.','역사를 왜곡할 수 없게 만든다.',{insight:3},'당신은 마지막 문서에 진짜 이름들을 적는다.','insight'],['왕관을 없애고 전혀 다른 길을 택한다.','세상을 바꾸는 도박을 감행한다.',{flux:3},'새벽의 종소리가 옛 규칙의 끝을 알린다.','flux']]}],endings:{harmony:['함께 쓴 왕국','왕좌보다 사람을 선택한 결과, {{place}}에는 여러 사람의 목소리가 함께 남는다. {{ally}}은 당신의 이름 옆에 자신의 이름을 적는다. 더 이상 영웅 한 명만으로 역사를 설명할 수 없다.'],truth:['지워지지 않는 기록','숨겨졌던 {{crisis}}이 공개된다. 누가 권력을 잡든 기록은 바뀌지 않는다. 당신이 선택한 진실은 새로운 시대의 첫 문장이 된다.'],storm:['왕관 없는 새벽','당신은 {{artifact}}이 약속하던 질서를 뒤집었다. 변화에는 혼란이 따르지만, 사람들은 처음으로 정해진 결말 밖을 상상한다.'],quiet:['또 하나의 역사','모든 것을 구할 수는 없었다. 그러나 {{ally}}은 당신과 함께 살아남은 기록을 보관한다. 언젠가 누군가 이 선택에서 다음 이야기를 시작할 것이다.']}},
{id:'signal',media:'anime',emoji:'✧',title:'영점의 새벽',subtitle:'별빛이 끊어진 날, 파일럿이 된 당신',genre:'SF · 학원 미스터리',shade:'#182f43',glow:'rgba(104,214,250,.28)',ally:'세나',place:'궤도도시 아스트라',artifact:'영점 코어',opponent:'중앙 관제국',crisis:'도시 정지 명령',intro:'하늘을 떠받치는 도시가 멈춰 서기까지 남은 시간은 단 하루. 당신이 조종석에 앉자, 폐기된 기계가 알 수 없는 신호를 보내기 시작한다.',scenes:[
{title:'끊어진 하늘',body:'{{place}}의 태양이 두 번 깜박인다. 실습장에 남아 있던 {{ally}}이 당신의 단말을 가리킨다. “이 신호, 미래에서 온 것 같아.”\n\n그리고 화면에는 아직 일어나지 않은 사고 시각이 표시되어 있다.',quote:'“미래를 볼 수 있다면, 바꾸는 것도 가능하지 않을까?”',choices:[['{{ally}}과 함께 신호를 해독한다.','동료와 주파수를 맞춘다.',{bond:2,insight:1},'서로의 단말이 같은 파장을 잡아낸다.','bond'],['신호의 발신 기록을 분석한다.','실마리를 찾는다.',{insight:2},'발신지가 존재하지 않는 구역이라는 사실을 알게 된다.','insight'],['폐기된 기체에 올라타 시험 비행한다.','위험한 변수를 만든다.',{flux:3},'기체가 새로운 움직임을 기억하기 시작한다.','flux']]},
{title:'기억 없는 조종석',body:'당신의 앞에 {{artifact}}의 접속 권한이 떠오른다. {{opponent}}은 즉시 폐쇄하라는 명령을 내리지만, 주변의 모든 화면이 하나의 질문을 반복한다. “사람을 먼저 구할 것인가, 도시를 먼저 지킬 것인가?”',quote:'“기계는 정답을 찾지만, 사람은 이유를 선택해.”',choices:[['대피 계획을 함께 세운다.','위험을 나누고 신뢰를 쌓는다.',{bond:2},'학생들이 서로의 경로를 확인한다.','bond'],['코어의 작동 기록을 추적한다.','멈춘 이유를 알아낸다.',{insight:3},'정지 명령의 원문이 드러난다.','insight'],['관제국의 명령을 무시하고 출항한다.','정해진 절차를 뒤집는다.',{flux:3},'도시 전체가 당신의 기체를 추적하기 시작한다.','flux']]},
{title:'반복되는 7분',body:'예고된 시각이 다가오자 시간이 7분씩 겹친다. {{ally}}은 분명 처음 보는 장면을 이미 기억한다고 말한다. 작은 선택 하나가 반복을 다르게 만든다.',quote:'“이번에는, 같은 장면에서 다른 답을 해 봐.”',choices:[['동료들이 기억을 공유하게 한다.','기억을 이어 붙인다.',{bond:3},'서로 다른 기억이 하나의 지도가 된다.','bond'],['반복 주기의 시작점을 찾는다.','원인을 특정한다.',{insight:3},'순환 고리를 고정하는 수식을 얻는다.','insight'],['일부러 예측과 다른 행동을 한다.','반복을 깨뜨린다.',{flux:3},'시간의 틈이 한순간 크게 벌어진다.','flux']]},
{title:'지상에서 온 목소리',body:'폐쇄된 통신 회선에서 지상의 목소리가 들린다. 지상은 존재하지 않는다고 배웠지만, 누군가는 도움을 기다리고 있었다. {{opponent}}의 명령이 또 한 번 울린다.',quote:'“화면 밖에 사람이 있다면, 그건 오류가 아니야.”',choices:[['지상과 도시를 함께 연결한다.','연결을 선택한다.',{bond:3},'긴 침묵 끝에 서로의 목소리가 이어진다.','bond'],['거짓으로 기록된 지도의 원본을 공개한다.','감춰진 세계를 드러낸다.',{insight:3},'도시의 역사 교육 자료가 다시 쓰인다.','insight'],['관제 네트워크를 재설정한다.','새 규칙을 강제한다.',{flux:3},'도시의 모든 화면이 일제히 꺼졌다 켜진다.','flux']]},
{title:'0초의 선택',body:'정지 시각 0초. 이제는 화면 속 수치보다 당신이 얻은 신뢰와 진실이 중요하다. {{ally}}은 마지막 통신을 보낸다. “어떤 미래든, 이번엔 우리가 골라.”',quote:'“미래는 예정된 장면이 아니라 선택의 합이야.”',choices:[['모두의 의견을 모아 새 항로를 정한다.','함께 항로를 그린다.',{bond:3},'조종석 밖에서도 수백 개의 불빛이 응답한다.','bond'],['영점 코어의 비밀을 끝까지 공개한다.','원인을 숨기지 않는다.',{insight:3},'사라졌던 데이터가 다시 연결된다.','insight'],['기존 항로를 버리고 미지의 방향으로 나아간다.','예측 불가능한 미래를 택한다.',{flux:3},'화면에 표시되지 않은 별 하나가 떠오른다.','flux']]}],endings:{harmony:['다시 연결된 별','{{place}}와 지상은 끊어진 통신을 회복했다. {{ally}}과 동료들은 한 사람의 영웅 대신 서로를 구한 기록을 남긴다.'],truth:['영점의 진실','{{artifact}}에 숨겨진 비밀이 공개되며 도시의 역사가 달라진다. 불편한 사실도 함께 직면한 사람들은 새로운 선택을 시작한다.'],storm:['지도 밖의 항로','당신은 {{opponent}}의 경로를 지우고 예측 불가능한 세계로 나아간다. 안정 대신 가능성을 택한 새 시대의 첫 장면이다.'],quiet:['불 꺼지지 않은 조종석','완벽한 미래는 아니지만 도시의 불빛은 남았다. {{ally}}은 내일 다시 시도할 수 있다는 사실이 가장 중요한 승리라고 말한다.']}},
{id:'save',media:'game',emoji:'⬡',title:'마지막 세이브',subtitle:'삭제된 엔딩을 찾아 게임의 규칙을 뒤집다',genre:'RPG · 로그 미스터리',shade:'#253324',glow:'rgba(151,229,152,.24)',ally:'NPC 루프',place:'잊힌 게임 월드',artifact:'마지막 저장 슬롯',opponent:'시스템 관리자',crisis:'엔딩 데이터 삭제',intro:'게임을 종료하려는 순간, 저장 슬롯에 없던 문구가 나타났다. “엔딩이 삭제되었습니다. 플레이어가 직접 다시 써 주세요.”',scenes:[
{title:'존재하지 않는 저장 파일',body:'{{place}}에 입장하자 튜토리얼 창이 깨진다. {{ally}}은 자신이 NPC라는 사실을 알고 있다. “이번에는 네가 선택한 대사를 내가 기억할게.”',quote:'“저장되었다고 해서, 옳았던 선택은 아니잖아?”',choices:[['{{ally}}의 말을 믿고 동행한다.','동료가 기억을 보존한다.',{bond:2},'{{ally}}의 대사창에 새로운 문장이 추가된다.','bond'],['오류 로그를 먼저 조사한다.','숨겨진 규칙을 찾는다.',{insight:2},'삭제된 퀘스트의 흔적을 확인한다.','insight'],['튜토리얼을 건너뛰고 금지된 지역으로 간다.','세계의 규칙을 시험한다.',{flux:3},'맵이 처음 보는 구조로 다시 생성된다.','flux']]},
{title:'리셋하지 않는 NPC',body:'반복될 때마다 마을 사람들이 같은 인사를 한다. 오직 {{ally}}만 당신을 알아본다. 그런데 마을 게시판에는 한 번도 보지 못한 엔딩의 조건이 적혀 있다.',quote:'“모든 퀘스트에는 보상이 있지만, 모든 사람에게 필요한 건 아니야.”',choices:[['주민의 의뢰를 함께 해결한다.','동료의 신뢰를 얻는다.',{bond:2},'NPC들의 일상이 조금씩 달라진다.','bond'],['엔딩 조건의 원본 파일을 찾는다.','정보를 확보한다.',{insight:3},'숨겨진 승리 조건을 알아낸다.','insight'],['메인 퀘스트를 일부러 실패한다.','예상하지 못한 플래그를 만든다.',{flux:3},'시스템에 새 이벤트가 등록된다.','flux']]},
{title:'보스가 없는 던전',body:'최종 던전에 보스는 없고 거울 세 개만 놓여 있다. 각각 과거, 현재, 선택하지 않은 미래를 비춘다. 거울은 한 가지 답만 요구하지 않는다.',quote:'“클리어보다 더 어려운 건 계속 플레이하기로 정하는 거야.”',choices:[['동료들의 기억을 하나로 묶는다.','함께 싸운 시간을 보존한다.',{bond:3},'여러 기억이 하나의 새로운 스킬이 된다.','bond'],['삭제된 데이터의 이유를 분석한다.','원래 목적을 밝혀낸다.',{insight:3},'삭제는 오류가 아니라 설계였다는 사실이 드러난다.','insight'],['거울을 지나 알려지지 않은 맵으로 이동한다.','규칙 밖으로 나아간다.',{flux:3},'월드맵에 존재하지 않던 좌표가 생긴다.','flux']]},
{title:'관리자의 제안',body:'{{opponent}}이 마지막 복구를 제안한다. 동의하면 모든 NPC의 기억은 초기화된다. 거절하면 스스로 엔딩을 만들어야 한다.',quote:'“완벽한 세계와 기억이 남는 세계는 다를 수 있어.”',choices:[['NPC들의 기억을 보존한다.','관계를 지키는 길이다.',{bond:3},'{{ally}}은 처음으로 자신의 선택지를 고른다.','bond'],['복구 시스템의 숨겨진 조항을 공개한다.','규칙을 모두에게 알린다.',{insight:3},'플레이어들에게 진짜 선택 조건이 표시된다.','insight'],['새로운 세이브 슬롯을 직접 생성한다.','원래 게임을 벗어난다.',{flux:3},'오류 경고 대신 새로운 시작 화면이 열린다.','flux']]},
{title:'엔딩을 저장할까요?',body:'새로운 메시지가 뜬다. “엔딩을 저장하려면 마지막 선택을 하세요.” {{ally}}은 더 이상 정해진 대사를 읽지 않는다. 이제 어떤 끝이든 당신의 로그에 남는다.',quote:'“이번 선택은 되돌릴 수 있어도, 없던 일이 되지는 않아.”',choices:[['모두의 이야기가 이어지는 엔딩을 만든다.','동료의 미래를 택한다.',{bond:3},'여러 이름이 크레딧에 올라간다.','bond'],['숨겨진 진실을 모든 플레이어에게 보여준다.','게임의 진실을 공개한다.',{insight:3},'미공개 데이터가 공개되어 세계의 규칙이 이해된다.','insight'],['엔딩을 삭제하고 새로운 1장을 연다.','결말 자체를 다시 정의한다.',{flux:3},'종료 버튼이 ‘계속하기’로 바뀐다.','flux']]}],endings:{harmony:['모두의 세이브 파일','{{place}}의 NPC들은 더 이상 잊히지 않는다. {{ally}}은 당신과 함께 마지막 크레딧을 읽고, 그다음 날의 첫 대사를 스스로 쓴다.'],truth:['숨겨진 진엔딩','{{crisis}}의 원인이 드러나고 원래 엔딩을 삭제한 규칙이 해제된다. 게임의 진짜 보상은 모든 플레이어에게 선택권이 돌아왔다는 사실이다.'],storm:['계속하기','당신은 {{artifact}}에 새로운 세계를 저장했다. 제작자가 예측하지 않은 모험이 시작되고, 첫 화면에는 단 하나의 버튼만 남는다. ‘계속하기’.'],quiet:['미완성 엔딩','일부 퀘스트는 미완성으로 남았지만 저장 파일은 사라지지 않았다. {{ally}}은 다음 플레이에서 이어 쓸 수 있는 미래를 지켜 냈다.']}},
{id:'witness',media:'drama',emoji:'◷',title:'마지막 증언',subtitle:'모두가 같은 거짓말을 할 때, 당신의 선택',genre:'현대 · 추리 드라마',shade:'#383025',glow:'rgba(232,180,111,.23)',ally:'기자 서윤',place:'해안도시 온유',artifact:'사라진 녹취록',opponent:'도시개발 위원회',crisis:'실종된 제보자의 진술',intro:'한밤중 방송국으로 도착한 음성 파일. 그 안에는 아직 보도되지 않은 사건의 진실이 담겨 있다. 하지만 파일 마지막 10초는 누군가 지웠다.',scenes:[
{title:'보도되지 않은 10초',body:'{{place}} 방송국에 도착한 {{artifact}}은 마지막 부분이 비어 있다. {{ally}}은 누군가 의도적으로 그 10초를 지웠다고 말한다. 다음 날, {{opponent}}의 공식 발표가 예정되어 있다.',quote:'“사실을 안다고 해서, 곧바로 전부 말해야 하는 건 아닐지도 몰라.”',choices:[['{{ally}}과 함께 제보자를 보호한다.','신뢰를 먼저 지킨다.',{bond:2},'제보자에게 안전한 연락 경로가 생긴다.','bond'],['원본 파일의 생성 기록을 확인한다.','객관적인 증거를 찾는다.',{insight:2},'편집 시각이 공식 발표 직전이라는 사실을 알게 된다.','insight'],['위원회에 직접 질문을 보낸다.','예상하지 못한 반응을 유도한다.',{flux:3},'공식 답변 대신 익명의 경고가 도착한다.','flux']]},
{title:'두 개의 인터뷰',body:'같은 사건을 본 두 사람이 전혀 다른 이야기를 한다. 둘 모두 자신이 진실을 말한다고 믿고 있다. 당신은 첫 보도에서 어떤 목소리를 우선할지 정해야 한다.',quote:'“빠른 보도보다 어려운 건 정확한 보도야.”',choices:[['두 사람을 다시 만나 맥락을 듣는다.','서로의 입장을 이해한다.',{bond:2,insight:1},'서로 다른 기억 사이에서 공통 장면을 찾아낸다.','bond'],['문서와 시간 기록을 대조한다.','진술의 교집합을 찾는다.',{insight:3},'거짓으로 표시된 시간표를 발견한다.','insight'],['기존 기사 대신 완전히 다른 질문을 던진다.','보도의 방향을 전환한다.',{flux:3},'새로운 제보가 예상 밖의 곳에서 들어온다.','flux']]},
{title:'편집실의 불빛',body:'편집장은 보도를 내일로 미루자고 제안한다. {{ally}}은 늦추면 제보자가 사라질 수 있다고 걱정한다. 어떤 결정을 내려도 누군가는 실망한다.',quote:'“결정을 미루는 것도 결국 하나의 결정이야.”',choices:[['제보자에게 사실 확인 과정을 설명한다.','신뢰를 무너뜨리지 않는다.',{bond:3},'제보자는 두 번째 자료를 보내기로 한다.','bond'],['원본과 복사본의 차이를 분석한다.','조작 흔적을 찾아낸다.',{insight:3},'누락된 10초의 단서를 확보한다.','insight'],['공식 발표 현장에서 공개 질문한다.','사건의 흐름을 흔든다.',{flux:3},'현장 분위기가 순식간에 바뀐다.','flux']]},
{title:'서로 다른 진실',body:'{{opponent}}은 유리한 자료만 보여 주며 모든 의혹이 해소됐다고 주장한다. 하지만 당신에게는 그 자료가 가린 한 사람의 기록이 남아 있다.',quote:'“내가 옳았다는 증거보다, 우리가 놓친 사실이 더 중요해.”',choices:[['관련자들의 답변 기회를 보장한다.','공정성을 지킨다.',{bond:2,insight:1},'서로 다른 목소리가 기사 안에 함께 담긴다.','bond'],['누락된 기록의 출처를 밝혀낸다.','사실을 한 단계 더 증명한다.',{insight:3},'자료의 출처가 공식 기록과 연결된다.','insight'],['방송 형식 자체를 바꿔 생방송 토론을 연다.','모두를 예상 밖의 장으로 부른다.',{flux:3},'사람들은 처음으로 같은 화면에서 질문을 듣는다.','flux']]},
{title:'생방송 1분 전',body:'방송이 시작되기 1분 전. {{ally}}은 오늘의 마지막 질문을 묻는다. 누군가를 무너뜨리는 보도를 할 것인지, 사실을 남기는 보도를 할 것인지. 당신은 마이크를 켠다.',quote:'“완벽한 정답이 없어도, 책임지는 선택은 할 수 있어.”',choices:[['관계자를 배려하면서 검증된 사실을 전달한다.','사람과 신뢰를 남긴다.',{bond:3},'방송 이후에도 대화가 이어진다.','bond'],['핵심 증거와 검증 과정을 공개한다.','사실에 끝까지 책임진다.',{insight:3},'시청자들은 판단에 필요한 자료를 얻는다.','insight'],['방송의 마지막 10초를 시청자의 질문으로 채운다.','예상하지 못한 결말을 연다.',{flux:3},'질문이 질문을 낳으며 새로운 이야기가 시작된다.','flux']]}],endings:{harmony:['끝나지 않은 대화','{{place}}의 사람들이 서로의 말을 듣기 시작한다. {{ally}}과 당신의 기사는 사건뿐 아니라 관계를 회복하는 계기가 된다.'],truth:['기록으로 남은 진실','{{crisis}}을 둘러싼 검증 가능한 사실이 공개된다. 사람들은 의혹이 아닌 근거를 바탕으로 선택할 수 있게 된다.'],storm:['새로운 생방송','당신의 예측 밖 진행 방식이 오래된 관행을 바꾼다. 마이크 앞에는 한 사람의 답 대신 여러 사람의 질문이 남는다.'],quiet:['마지막 10초의 의미','모든 의문은 풀리지 않았다. 하지만 {{ally}}은 성급한 결말 대신 확인할 수 있는 사실을 남긴 것에 의미가 있다고 말한다.']}}
];
const customChapters=[
{title:'이야기 밖의 초대장',body:'당신은 {{place}}에서 낯선 소식을 듣는다. {{crisis}} 때문에 평범했던 일상이 달라지기 시작한다. {{ally}}이 도움을 청하지만 {{opponent}}의 움직임도 심상치 않다.\n\n{{intro}}',quote:'“여기서부터는 원래 정해진 길로 갈 필요가 없어.”',choices:[['{{ally}}과 손잡고 움직인다.','동료와 함께 상황을 살핀다.',{bond:2},'서로의 약속이 이야기의 첫 분기를 만든다.','bond'],['사건의 근거를 찾아 나선다.','진실에 다가간다.',{insight:2},'{{crisis}}의 첫 실마리를 얻는다.','insight'],['아무도 예상하지 못한 방법을 시도한다.','새로운 사건을 촉발한다.',{flux:3},'예정된 진행이 흔들리기 시작한다.','flux']]},
{title:'새로 등장한 변수',body:'{{artifact}}을 둘러싸고 서로 다른 주장이 나온다. {{ally}}은 당신에게 선택을 맡긴다. 당신이 첫 장에서 한 결정은 이미 주변 사람들의 태도를 바꿔 놓았다.',quote:'“전개를 바꾸려면 누군가는 먼저 평소와 다른 말을 해야 해.”',choices:[['사람들의 협력을 이끌어 낸다.','함께 해결할 길을 만든다.',{bond:2},'동료들이 당신에게 계획을 맡긴다.','bond'],['{{artifact}}의 비밀을 조사한다.','숨겨진 규칙을 확인한다.',{insight:2},'중요한 사실 하나가 드러난다.','insight'],['상대보다 먼저 결정을 내린다.','이야기의 속도를 바꾼다.',{flux:3},'{{opponent}}이 예상보다 빨리 움직인다.','flux']]},
{title:'바뀐 관계',body:'{{place}}의 사람들은 더 이상 처음과 같은 말을 하지 않는다. {{ally}}이 당신에게 이전과 다른 제안을 건넨다. 당신의 선택은 사건뿐 아니라 사람들의 마음도 바꿀 수 있다.',quote:'“내가 믿는 건 예언이 아니라 지금 여기서 한 약속이야.”',choices:[['{{ally}}의 제안을 받아들인다.','서로의 신뢰를 이어 간다.',{bond:3},'작은 약속이 더 큰 협력으로 이어진다.','bond'],['제안의 숨은 이유를 묻는다.','의도를 확인한다.',{insight:3},'보이지 않던 배경을 이해한다.','insight'],['제안을 거절하고 새로운 길을 찾는다.','예상 밖 전개를 택한다.',{flux:3},'기존 인물 관계도가 크게 바뀐다.','flux']]},
{title:'결말이 갈라지는 순간',body:'{{opponent}}이 최종 제안을 내놓는다. 받아들이면 당장의 위기는 끝날지도 모른다. 하지만 {{crisis}}의 근본 원인은 그대로 남는다.',quote:'“쉬운 결말이 언제나 좋은 결말은 아니니까.”',choices:[['함께 해결할 대안을 제시한다.','관계를 유지하며 문제에 대응한다.',{bond:3},'협상장에 새로운 목소리들이 모인다.','bond'],['숨겨진 사실을 세상에 알린다.','진실을 선택한다.',{insight:3},'사람들이 새로운 판단을 시작한다.','insight'],['기존 규칙을 깨는 제안을 한다.','극적인 전환을 만든다.',{flux:3},'아무도 예측하지 못한 선택지가 생긴다.','flux']]},
{title:'당신이 쓴 마지막 장',body:'{{place}}에 마지막 날이 찾아온다. {{artifact}}을 바라보며 당신은 처음 이 세계에 들어왔을 때를 떠올린다. 이야기에는 더 이상 단 하나의 정답만 존재하지 않는다.',quote:'“원래의 결말은 참고서일 뿐이야. 이제 네 차례야.”',choices:[['모두가 함께 살아갈 내일을 고른다.','동료들의 미래를 선택한다.',{bond:3},'미래를 결정하는 자리에 모두가 함께 선다.','bond'],['모든 사실이 밝혀지는 결말을 고른다.','숨겨진 진실을 드러낸다.',{insight:3},'사건의 전말이 기록된다.','insight'],['아예 새로운 세계의 규칙을 만든다.','원래 없던 결말을 선택한다.',{flux:3},'이야기의 마지막 문장이 지워지고 새 문장이 나타난다.','flux']]}];
const customEndings={harmony:['함께 만든 결말','{{place}}에서 {{ally}}과 함께 여러 사람의 선택이 모여 새로운 내일을 만든다. 원래의 진행과 달리, 이 이야기는 한 사람의 승리만을 기억하지 않는다.'],truth:['드러난 진실','{{crisis}}의 진상이 드러난다. {{artifact}}을 둘러싼 비밀도 밝혀지고 사람들은 처음보다 더 많은 사실을 알고 다음 선택을 시작한다.'],storm:['규칙 밖의 이야기','당신의 마지막 선택으로 {{place}}의 규칙이 달라진다. {{opponent}}도 예상하지 못한 길이 열렸고, 이제 어떤 결말도 미리 확정되지 않았다.'],quiet:['다음 장을 남기다','모든 문제는 해결되지 않았지만 {{ally}}은 새로운 가능성을 발견했다. 이야기는 여기서 잠시 멈추고, 다음 선택을 기다린다.']};
const app=document.getElementById('app');
const clean=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const truncate=(s,n)=>String(s||'').slice(0,n);
const emptyStats=()=>({bond:1,insight:1,flux:1});
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE));return v&&typeof v==='object'?v:{}}catch{return {}}}
const stored=load();
let state={screen:'studio',filter:'all',custom:Array.isArray(stored.custom)?stored.custom:[],session:stored.session||null,modal:null,selectedWorld:null,toast:'',showTimeline:false,player:'방문자'};
let toastTimer;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({custom:state.custom,session:state.session}))}catch(e){console.warn('저장 불가',e)}}
function worldById(id){return [...baseWorlds,...state.custom].find(w=>w.id===id)}
function templ(str,world,session){return clean(String(str??'').replace(/\{\{(\w+)\}\}/g,(m,k)=>k==='protagonist'?(session?.name||'방문자'):world[k]??m))}
function toast(msg){state.toast=msg;renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';renderToast()},2600)}
function renderToast(){document.querySelectorAll('.toast').forEach(e=>e.remove());if(state.toast){const e=document.createElement('div');e.className='toast';e.textContent=state.toast;document.body.appendChild(e)}}
function nav(which){state.screen=which;state.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function startSetup(id){state.selectedWorld=id;state.modal='start';render()}
function beginWorld(){const world=worldById(state.selectedWorld);if(!world)return;const name=truncate(document.getElementById('playerName')?.value.trim()||'방문자',22);state.session={id:world.id,name,chapter:0,stats:emptyStats(),history:[],ending:null,started:new Date().toISOString()};persist();state.modal=null;state.screen='play';render();window.scrollTo(0,0)}
function recompute(session){const s=emptyStats();session.history.forEach(h=>{for(const k of Object.keys(s))s[k]=Math.max(0,Math.min(15,s[k]+(h.effect?.[k]||0)))});session.stats=s;session.chapter=session.history.length;session.ending=session.chapter>=worldById(session.id).scenes.length?endingFor(s):null}
function endingFor(stats){if(stats.flux>=9&&stats.flux>stats.bond&&stats.flux>stats.insight)return'storm';if(stats.bond>=7&&stats.insight>=6)return'harmony';if(stats.insight>=9&&stats.insight>=stats.bond)return'truth';if(stats.bond>=8&&stats.bond>=stats.insight)return'harmony';if(stats.flux>=8)return'storm';return'quiet'}
function choose(index){const ses=state.session,world=worldById(ses?.id);if(!ses||!world||ses.ending)return;const scene=world.scenes[ses.chapter], choice=scene?.choices[index];if(!choice)return;ses.history.push({chapter:ses.chapter,choice:index,label:choice[0],effect:choice[2],reaction:choice[3],type:choice[4]});recompute(ses);persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function rewind(index){const ses=state.session;if(!ses)return;ses.history=ses.history.slice(0,index);recompute(ses);persist();state.screen='play';render();window.scrollTo({top:0,behavior:'smooth'});toast('선택 분기점으로 돌아왔어')}
function resetSession(){if(!confirm('현재 이야기를 처음부터 다시 시작할까? 지금 선택 기록이 초기화돼.'))return;const id=state.session?.id,name=state.session?.name||'방문자';if(!id)return;state.session={id,name,chapter:0,stats:emptyStats(),history:[],ending:null,started:new Date().toISOString()};persist();nav('play')}
function saveText(){const s=state.session,w=worldById(s?.id);if(!s||!w)return;const lines=[`WORLDLINE / ${w.title}`,`주인공: ${s.name}`,`장르: ${w.genre}`,'',...s.history.flatMap((h,i)=>[`제${i+1}장 — ${w.scenes[i].title}`,`선택: ${w.scenes[i].choices[h.choice][0]}`,`결과: ${w.scenes[i].choices[h.choice][3]}`,'']),s.ending?`엔딩: ${w.endings[s.ending][0]}`:'진행 중'];download(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),`Worldline_${safeName(w.title)}.txt`);toast('선택 기록을 다운로드했어')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function safeName(s){return String(s).replace(/[^\w가-힣-]/g,'_')}
function exportData(){download(new Blob([JSON.stringify({version:1,custom:state.custom,session:state.session},null,2)],{type:'application/json'}),'worldline_save.json');toast('저장 데이터를 내보냈어')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.version!==1||!Array.isArray(data.custom))throw Error('잘못된 파일');state.custom=data.custom.filter(w=>w&&w.id&&Array.isArray(w.scenes)).slice(0,30);state.session=data.session&&worldById(data.session.id)?data.session:null;if(state.session)recompute(state.session);persist();nav('library');toast('데이터를 불러왔어')}catch{toast('Worldline 저장 파일인지 확인해 줘')}};reader.readAsText(file)}
function createWorld(){const get=(id,max)=>truncate(document.getElementById(id)?.value.trim()||'',max);const title=get('cTitle',40),place=get('cPlace',60),ally=get('cAlly',35),opponent=get('cOpponent',50),crisis=get('cCrisis',100),artifact=get('cArtifact',50),intro=get('cIntro',500);if(!title||!place||!ally||!crisis){toast('필수 항목을 입력해 줘');return}const media=document.getElementById('cMedia').value;const id='custom_'+Date.now();state.custom.unshift({id,media,emoji:{novel:'📜',anime:'✦',game:'◇',drama:'◌'}[media],title,subtitle:'내가 직접 만든 세계',genre:'사용자 세계관',shade:'#302647',glow:'rgba(196,157,255,.22)',place,ally,opponent:opponent||'알 수 없는 세력',crisis,artifact:artifact||'비밀의 열쇠',intro,scenes:customChapters,endings:customEndings});state.modal=null;persist();render();toast('새로운 세계가 추가됐어')}
function delCustom(id){if(!confirm('이 세계를 목록에서 삭제할까?'))return;state.custom=state.custom.filter(w=>w.id!==id);if(state.session?.id===id)state.session=null;persist();render();toast('세계가 삭제됐어')}
function renderNav(){return `<aside class="rail"><div class="logo"><div class="logo-mark">✧</div>WORLDLINE</div><div class="rail-sub">REWRITE THE STORY</div><div><div class="rail-label">이야기</div>${[['home','⌂','세계 탐험'],['studio','✧','AI 자유 입력 스토리'],['library','▤','내 서재'],['play','◇','클래식 선택형 (이전)']].map(([k,i,label])=>`<button class="nav-button ${state.screen===k?'active':''}" data-nav="${k}"><span class="nav-icon">${i}</span>${label}</button>`).join('')}</div><div><div class="rail-label">만들기</div><button class="nav-button" data-modal="create"><span class="nav-icon">＋</span>내 세계 만들기</button><button class="nav-button" data-nav="studio"><span class="nav-icon">✧</span>텍본·AI 분석</button><button class="nav-button" data-modal="help"><span class="nav-icon">ⓘ</span>도움말</button></div><div class="rail-foot"><b>이야기의 다음 장은 너의 선택.</b><br>세계관·진행 기록은 브라우저에 저장돼. AI 실시간 생성에는 별도 서버 연결이 필요해.</div></aside>`}
function renderTop(){return `<header class="topbar"><div class="mobile-nav"><span class="logo"><span class="logo-mark">✧</span> WORLDLINE</span></div><small>${state.screen==='play'?'NOW WRITING YOUR WORLDLINE':state.screen==='studio'?'WRITE WHAT YOU DO · CHANGE THE STORY':state.screen==='library'?'YOUR STORIES & SAVES':'CHOOSE A WORLD · CHANGE THE ENDING'}</small><div class="top-actions"><button class="btn btn-small btn-ghost" data-nav="home">⌂ <span class="hide-small">홈</span></button><button class="btn btn-small btn-ghost" data-modal="create">＋ 세계 만들기</button>${state.session?`<button class="btn btn-small" data-nav="play">이어하기 ↗</button>`:''}</div></header>`}
function renderHome(){const worlds=[...baseWorlds,...state.custom].filter(w=>state.filter==='all'||w.media===state.filter);return `<div class="page"><section class="hero"><span class="eyebrow">INTERACTIVE UNIVERSE</span><h1>결말은 이미 정해졌다고?<br><em>이번엔 네가 바꿔.</em></h1><p>소설, 애니, 게임, 드라마의 주인공이 되어 봐. 네가 선택할 때마다 인물의 마음과 사건의 방향이 달라지고, 마지막 페이지에는 새로운 엔딩이 기다려.</p><div class="hero-bottom"><button class="btn btn-primary" data-nav="studio">✧ 자유 행동으로 시작 <span>↗</span></button><button class="btn" data-modal="create">＋ 내 세계 만들기</button><button class="btn" data-nav="studio">✧ 텍본·AI 세계관 분석</button></div></section><div class="section-head" id="worlds"><div><h2>들어갈 세계를 선택해</h2><p>기본 창작 세계 4개 · 분기형 스토리 · 다양한 결말</p></div><div class="filter-list">${[['all','전체'],['novel','소설'],['anime','애니'],['game','게임'],['drama','드라마']].map(([id,label])=>`<button class="filter ${state.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div></div><div class="world-grid">${worlds.length?worlds.map(renderWorldCard).join(''):'<div class="empty">해당 유형의 세계가 없어.</div>'}</div><div class="mini-grid"><div class="mini"><b>✧ 선택으로 바뀌는 전개</b><span>같은 장면에서도 다른 결과와 관계 변화</span></div><div class="mini"><b>◇ 4가지 엔딩</b><span>유대·진실·변수에 따라 다른 결말</span></div><div class="mini"><b>↶ 언제든 되돌리기</b><span>갈림길을 되짚어 다른 세계선 탐험</span></div></div><p class="notice">이 앱은 오프라인 스토리 엔진이야. 기존 상업 작품의 원문이나 실제 줄거리를 자동으로 불러오지는 않아. 네가 만든 세계관을 입력하면 해당 설정을 바탕으로 새로운 분기형 이야기를 진행할 수 있어.</p></div>`}
function renderWorldCard(w){return `<article class="world-card" style="--shade:${clean(w.shade)};--glow:${clean(w.glow)}"><span class="chip">${MEDIA[w.media]} · ${clean(w.genre)}</span><div class="art" aria-hidden="true">${clean(w.emoji)}</div><h3>${clean(w.title)}</h3><p>${clean(w.subtitle||w.intro)}</p><button class="enter" data-start="${clean(w.id)}">세계에 들어가기 &nbsp;↗</button></article>`}
function statBar(k,n){const colors={bond:'#9ad8c6',insight:'#c8acf9',flux:'#efbd91'};return `<div class="stat-row"><div class="stat-line"><span>${STAT[k]}</span><b>${n}</b></div><div class="meter"><i style="background:${colors[k]};width:${Math.min(100,n/15*100)}%"></i></div></div>`}
function renderSidebar(w,s){return `<aside class="play-side"><section class="side-card"><div class="side-head"><div class="side-art">${clean(w.emoji)}</div><div><b>${clean(w.title)}</b><span>${MEDIA[w.media]} · ${clean(s.name)}</span></div></div><div style="margin-top:18px">${Object.keys(STAT).map(k=>statBar(k,s.stats[k])).join('')}</div><small class="subtle">선택에 따라 수치와 엔딩이 바뀐다.</small></section><section class="side-card"><h3>지금까지의 선택</h3>${s.history.length?`<ol class="timeline">${s.history.map((h,i)=>`<li><b>제${i+1}장</b>${templ(h.label,w,s)}<div><button class="btn btn-small btn-ghost" style="padding:2px 0;min-height:20px;margin-top:3px" data-rewind="${i}">↶ 여기서 다시</button></div></li>`).join('')}</ol>`:'<p class="subtle">첫 번째 선택을 기다리는 중이야.</p>'}</section><section class="side-card side-actions"><button class="btn btn-small" data-export-text>↓ 이야기 기록 저장</button><button class="btn btn-small" data-reset>↻ 처음부터 다시</button><button class="btn btn-small btn-ghost" data-nav="home">← 다른 세계 보기</button></section></aside>`}
function getVariant(h,s,w){if(!h)return'';const v={bond:'네가 맺은 약속 덕분에 사람들은 서로에게 조금 더 마음을 연다. 이제 {{ally}}도 망설임 없이 당신의 편에 선다.',insight:'찾아낸 사실이 기존의 상식을 흔든다. {{crisis}}에 대한 새로운 해석이 가능해졌다.',flux:'예상 밖 행동의 여파로 평범했을 장면이 완전히 다른 방향으로 흘러간다.'}[h.type]||'';return templ(v,w,s)}
function renderPlay(){const s=state.session,w=worldById(s?.id);if(!s||!w)return `<div class="page"><div class="empty">진행 중인 이야기가 없어.<br><br><button class="btn btn-primary" data-nav="home">세계 선택하기</button></div></div>`;if(s.ending)return renderEnding(w,s);const idx=s.chapter,sc=w.scenes[idx],last=s.history[idx-1];return `<div class="page"><div class="breadcrumb">${MEDIA[w.media]} <span>›</span> ${clean(w.title)} <span>›</span> 제${idx+1}장</div><div class="play-layout"><main class="play-main"><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(idx/w.scenes.length*100)}"><i style="width:${idx/w.scenes.length*100}%"></i></div><article class="story-area">${last?`<div class="reaction"><b>이전 선택의 여파 · ${templ(last.label,w,s)}</b><p>${templ(last.reaction,w,s)} ${getVariant(last,s,w)}</p></div>`:''}<div class="story-chapter">CHAPTER ${String(idx+1).padStart(2,'0')} / ${String(w.scenes.length).padStart(2,'0')}</div><h1 class="story-title">${templ(sc.title,w,s)}</h1><div class="story-body">${templ(sc.body,w,s).split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><blockquote class="story-quote">${templ(sc.quote,w,s)}</blockquote></article><h3 class="choice-heading">이제 어떻게 할까? <span class="subtle" style="font-weight:400">선택이 다음 전개와 엔딩에 영향을 줘.</span></h3><div class="choices">${sc.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="choice-index">${String(i+1).padStart(2,'0')}</span><span class="choice-content"><span class="choice-name">${templ(c[0],w,s)}</span><span class="choice-desc">${templ(c[1],w,s)}</span><span class="choice-effects">${Object.entries(c[2]).map(([k,v])=>`<span class="stat-tag ${k==='flux'?'risk':'plus'}">${STAT[k]} +${v}</span>`).join('')}</span></span><span style="color:#bb9add">↗</span></button>`).join('')}</div></main>${renderSidebar(w,s)}</div></div>`}
function renderEnding(w,s){const [title,body]=w.endings[s.ending]||w.endings.quiet;const icons={harmony:'✦',truth:'◈',storm:'↗',quiet:'◌'};return `<div class="page"><div class="breadcrumb">${MEDIA[w.media]} › ${clean(w.title)} › 엔딩</div><div class="ending-card"><div class="eyebrow" style="justify-content:center">WORLDLINE COMPLETED</div><div class="ending-icon">${icons[s.ending]}</div><div class="chip">${{harmony:'유대의 엔딩',truth:'진실의 엔딩',storm:'변화의 엔딩',quiet:'여운의 엔딩'}[s.ending]}</div><h1>${templ(title,w,s)}</h1><p>${templ(body,w,s)}</p><p>원래 존재했던 단 하나의 길 대신, <b>${clean(s.name)}</b>의 ${s.history.length}번의 선택이 이 결말을 만들었다.</p><div class="ending-summary"><b>너의 선택 기록</b><ol>${s.history.map((h,i)=>`<li>제${i+1}장 · ${templ(h.label,w,s)}</li>`).join('')}</ol></div><div class="end-actions"><button class="btn btn-primary" data-rewind="${Math.max(0,s.history.length-1)}">↶ 마지막 선택 바꾸기</button><button class="btn" data-reset>↻ 처음부터</button><button class="btn" data-export-text>↓ 이야기 저장</button><button class="btn btn-ghost" data-nav="home">다른 세계</button></div></div></div>`}
function renderLibrary(){const s=state.session,w=worldById(s?.id);return `<div class="page"><div class="eyebrow">YOUR LIBRARY</div><h1 style="font-size:29px;margin:11px 0 4px">내 서재</h1><p class="subtle" style="margin-bottom:28px">진행 중인 이야기, 만든 세계, 저장 데이터를 관리해.</p><div class="section-head"><h2>이어할 이야기</h2></div>${s&&w?`<div class="saved-item"><div><b>${clean(w.emoji)} ${clean(w.title)}</b><small>${s.ending?'완료한 엔딩 · '+clean(w.endings[s.ending][0]):'제'+(s.chapter+1)+'장 진행 중'} · ${clean(s.name)}</small></div><button class="btn btn-primary btn-small" data-nav="play">계속하기</button></div>`:'<div class="empty">아직 시작한 이야기가 없어.</div>'}<div class="section-head"><h2>내가 만든 세계</h2><button class="btn btn-small" data-modal="create">＋ 만들기</button></div>${state.custom.length?state.custom.map(w=>`<div class="saved-item"><div><b>${clean(w.emoji)} ${clean(w.title)}</b><small>${MEDIA[w.media]} · ${clean(w.place)}</small></div><div style="display:flex;gap:8px"><button class="btn btn-primary btn-small" data-start="${clean(w.id)}">진입</button><button class="btn btn-small" data-delete="${clean(w.id)}">삭제</button></div></div>`).join(''):'<div class="empty">직접 만든 세계가 아직 없어. 좋아하는 장르나 네가 만든 설정을 입력해 봐.</div>'}<div class="section-head"><h2>저장 데이터</h2></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" data-export>↓ JSON 백업</button><label class="btn" for="importFile">↑ JSON 불러오기</label><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div><p class="notice">현재 브라우저의 로컬 저장소에 자동 저장돼. Safari 데이터를 지우면 기록도 사라질 수 있으니 필요하면 JSON으로 백업해.</p></div>`}
function renderModal(){if(!state.modal)return'';if(state.modal==='help')return `<div class="modal-backdrop" data-outside><div class="modal" role="dialog" aria-modal="true" aria-label="도움말"><div class="modal-head"><h2>어떻게 플레이할까?</h2><button class="close" data-close>×</button></div><p>세계에 들어가 선택지를 누르면 유대·진실·변수 수치가 달라지고, 이전 결정의 여파가 다음 장에 반영돼. 마지막에는 수치와 선택에 따라 서로 다른 결말을 볼 수 있어.</p><p><b style="color:white">내 세계 만들기</b><br>작품 유형과 네가 알고 있는 설정을 직접 입력하면, 해당 이름과 배경을 바탕으로 새 분기형 이야기를 만들 수 있어. 원작의 등장인물·줄거리를 자동으로 읽어오는 AI 기능은 포함되지 않아.</p><p><b style="color:white">저장 및 개인 정보</b><br>로그인 없이 이 기기 브라우저에 저장돼. 다른 기기로 옮기려면 내 서재에서 JSON 백업을 이용해.</p><div class="modal-actions"><button class="btn btn-primary" data-close>확인</button></div></div></div>`;
if(state.modal==='start'){const w=worldById(state.selectedWorld);if(!w)return'';return `<div class="modal-backdrop" data-outside><div class="modal" role="dialog" aria-modal="true" aria-label="세계 진입"><div class="modal-head"><div><span class="eyebrow">ENTER THE WORLD</span><h2>${clean(w.title)}</h2></div><button class="close" data-close>×</button></div><p>${clean(w.intro)}</p><div class="form-field"><label for="playerName">이 세계에서 사용할 이름</label><input id="playerName" maxlength="22" value="${clean(state.session?.name||'방문자')}" autocomplete="off"><small class="subtle">이름은 이야기와 엔딩에 표시돼.</small></div><div class="modal-actions"><button class="btn" data-close>취소</button><button class="btn btn-primary" data-begin>세계 진입하기 ↗</button></div></div></div>`}
if(state.modal==='create')return `<div class="modal-backdrop" data-outside><div class="modal" role="dialog" aria-modal="true" aria-label="내 세계 만들기"><div class="modal-head"><div><span class="eyebrow">CREATE A UNIVERSE</span><h2>내 세계 만들기</h2></div><button class="close" data-close>×</button></div><p>좋아하는 작품의 세계관을 직접 요약하거나 완전히 새로운 설정을 만들어 봐. 입력한 이름과 세계관을 활용해 5장짜리 선택형 모험이 생성돼.</p><div class="form-grid"><div class="form-field"><label for="cTitle">세계 / 작품 이름 *</label><input id="cTitle" placeholder="예: 푸른 달의 학교" maxlength="40"></div><div class="form-field"><label for="cMedia">형식</label><select id="cMedia">${Object.entries(MEDIA).map(([id,label])=>`<option value="${id}">${label}</option>`).join('')}</select></div><div class="form-field"><label for="cPlace">배경이 되는 장소 *</label><input id="cPlace" placeholder="예: 별빛 도시의 학교" maxlength="60"></div><div class="form-field"><label for="cAlly">주요 동료 이름 *</label><input id="cAlly" placeholder="예: 하린" maxlength="35"></div><div class="form-field"><label for="cOpponent">갈등 상대</label><input id="cOpponent" placeholder="예: 비밀 위원회" maxlength="50"></div><div class="form-field"><label for="cArtifact">중요한 물건 또는 단서</label><input id="cArtifact" placeholder="예: 시간을 되돌리는 시계" maxlength="50"></div><div class="form-field full"><label for="cCrisis">바꾸고 싶은 사건 / 갈등 *</label><input id="cCrisis" placeholder="예: 졸업식 날 도시의 시간이 멈춤" maxlength="100"></div><div class="form-field full"><label for="cIntro">세계관 / 원래 전개 요약 (선택)</label><textarea id="cIntro" maxlength="500" placeholder="이 세계가 어떤 곳인지, 어떤 사건이 원래 일어나는지 내 말로 설명해 줘."></textarea></div></div><div class="modal-actions"><button class="btn" data-close>취소</button><button class="btn btn-primary" data-create>세계 저장하기 ↗</button></div></div></div>`;return''}
function render(){app.innerHTML=renderNav()+`<div class="main">${renderTop()}${state.screen==='studio'?window.WorldlineStudio?.render()||'<div class=page>AI 스튜디오 로딩 중…</div>':state.screen==='play'?renderPlay():state.screen==='library'?renderLibrary():renderHome()}</div>`+renderModal();renderToast()}
app.addEventListener('click',e=>{const b=e.target.closest('button,[data-outside]');if(!b)return;if(b.dataset.studio&&window.WorldlineStudio?.onClick(e,b))return;if(b.hasAttribute('data-outside')){if(e.target===b){state.modal=null;render()}return}if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.modal){state.modal=b.dataset.modal;render();return}if(b.hasAttribute('data-close')){state.modal=null;render();return}if(b.dataset.start){startSetup(b.dataset.start);return}if(b.hasAttribute('data-begin')){beginWorld();return}if(b.dataset.choice!==undefined){choose(Number(b.dataset.choice));return}if(b.dataset.rewind!==undefined){rewind(Number(b.dataset.rewind));return}if(b.hasAttribute('data-reset')){resetSession();return}if(b.hasAttribute('data-export-text')){saveText();return}if(b.hasAttribute('data-export')){exportData();return}if(b.hasAttribute('data-create')){createWorld();return}if(b.dataset.delete){delCustom(b.dataset.delete);return}if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}});
app.addEventListener('change',e=>{if(window.WorldlineStudio?.onChange(e))return;if(e.target.id==='importFile')importData(e.target.files?.[0])});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='playerName')beginWorld()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
if(state.session&&!worldById(state.session.id))state.session=null;
if(state.session){try{recompute(state.session)}catch{state.session=null}}
render();
</script>

</script>
<script>
/* WORLDLINE AI Studio - local-first extension; no OpenAI API key is stored in this file. */
(()=>{
'use strict';
const STORE='worldline_ai_studio_v3', OLD_STORE='worldline_ai_studio_v2', ACCESS='worldline_ai_access_session';
const MEDIA_LABEL={novel:'📖 소설',anime:'✦ 애니',game:'🎮 게임',drama:'🎬 드라마'};
const DEFAULT_STYLE='섬세한 한국·일본풍 판타지 애니메이션 일러스트, 연한 아이보리와 은빛이 섞인 맑은 색감, 자연광, 부드러운 수채화 풍 채색, 가느다란 머리카락과 섬세한 눈 묘사, 서정적인 분위기, 장면에 어울리는 절제된 붉은색 포인트. 인물과 배경·의상은 반드시 현재 이야기의 설정에 맞게 새롭게 디자인. 매번 다른 구도·시점·표정·조명. 원본 사진을 복제하거나 특정 인물을 고정 등장시키지 말 것.';
const defaultBible=(title='새로운 세계')=>({title,summary:'',setting:'',characters:[],rules:[],timeline:[],tensions:[],unknowns:[],sources:[]});
function init(){try{const p=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(OLD_STORE)||'null');return p&&typeof p==='object'?p:null}catch{return null}}
const saved=init();
const S={tab:'build',title:'',media:'novel',notes:'',links:'',player:'방문자',premise:'',endpoint:saved?.endpoint||'',worlds:Array.isArray(saved?.worlds)?saved.worlds.slice(0,18):[],activeId:saved?.activeId||'',run:saved?.run||null,bible:null,rawText:'',fileNames:[],fileInfo:'',busy:false,progress:'',pendingChoice:'',sources:[],status:'',preview:'',visualStyle:saved?.visualStyle||DEFAULT_STYLE,appearance:saved?.appearance||'',styleReference:saved?.styleReference||'',illustrationBusy:false,illustrationStatus:'',styleInfo:saved?.styleReference?'이전에 업로드한 스타일 참조 이미지가 저장돼 있어.':'참조 이미지는 선택 사항이야.',...{}};
S.bible = S.worlds.find(w=>w.id===S.activeId)?.bible||defaultBible();
S.bridgeMode=saved?.bridgeMode!==false; // default: ChatGPT manual bridge, no paid API calls
const imageCache=new Map(); let imgDBPromise=null;
function imageDB(){if(!('indexedDB' in window))return Promise.reject(Error('indexedDB unavailable'));if(!imgDBPromise)imgDBPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('worldline-scenes-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return imgDBPromise}
async function imagePut(key,b64){imageCache.set(key,b64);try{const db=await imageDB();await new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(b64,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{}}
async function imageGet(key){if(imageCache.has(key))return imageCache.get(key);try{const db=await imageDB();return await new Promise((res,rej)=>{const tx=db.transaction('images','readonly');const r=tx.objectStore('images').get(key);r.onsuccess=()=>{if(r.result)imageCache.set(key,r.result);res(r.result||'')};r.onerror=()=>rej(r.error)})}catch{return ''}}
async function hydrateImages(){for(const el of document.querySelectorAll('[data-worldline-image]')){const key=el.dataset.worldlineImage;if(!key||el.dataset.ready==='yes')continue;const data=await imageGet(key);if(data&&el.isConnected){el.src='data:image/png;base64,'+data;el.dataset.ready='yes'}}}
let accessToken=sessionStorage.getItem(ACCESS)||'';
const esc=s=>clean(String(s??''));
const urlSafe=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const lines=s=>String(s||'').split(/\n+/).map(v=>v.trim()).filter(Boolean).slice(0,60);
const unique=a=>[...new Set(a)];
function persistStudio(){try{
  const worlds=S.worlds.slice(0,18).map(w=>({id:w.id,media:w.media,title:w.title,bible:w.bible,created:w.created}));
  const run=S.run?{worldId:S.run.worldId,player:S.run.player,premise:S.run.premise,chapter:S.run.chapter,history:S.run.history.slice(-60),current:S.run.current,recap:S.run.recap,choice:S.run.choice,continuity:S.run.continuity||[],visualHistory:S.run.visualHistory||[],illustrations:S.run.illustrations||{}}:null;
  localStorage.setItem(STORE,JSON.stringify({endpoint:S.endpoint,worlds,activeId:S.activeId,run,visualStyle:S.visualStyle,appearance:S.appearance,styleReference:S.styleReference,bridgeMode:S.bridgeMode}));
}catch(e){alert('저장 공간이 부족해. 세계관을 줄이거나 기존 항목을 삭제한 뒤 다시 시도해.')}}
function activeWorld(){return S.worlds.find(w=>w.id===S.activeId)}
function updateStatus(msg){S.status=msg;const el=document.getElementById('studioStatus');if(el)el.textContent=msg}
function show(){if(state.screen==='studio'){window.render();Promise.resolve().then(hydrateImages)}}
function captureSetup(){for(const [id,k] of [['wsTitle','title'],['wsNotes','notes'],['wsLinks','links'],['wsPlayer','player'],['wsPremise','premise'],['wsEndpoint','endpoint'],['wsStyle','visualStyle'],['wsAppearance','appearance']]){
  const v=document.getElementById(id);if(v)S[k]=v.value;
}const m=document.getElementById('wsMedia');if(m)S.media=m.value}
function hasConfig(){return !!(S.endpoint&&accessToken)}
function useBridge(){return S.bridgeMode||!hasConfig()}
async function callAI(action,data){
  if(!hasConfig())throw Error('AI 연결 설정이 필요해. 먼저 연결 주소와 접근 암호를 등록해 줘.');
  const endpoint=S.endpoint.trim().replace(/\/$/,'');if(!/^https:\/\//.test(endpoint))throw Error('연결 주소는 https://로 시작해야 해.');
  const response=await fetch(endpoint+'/api',{method:'POST',headers:{'Content-Type':'application/json','X-Worldline-Access':accessToken,'X-Worldline-Operation':action},body:JSON.stringify({action,...data})});
  let result;try{result=await response.json()}catch{throw Error('서버 응답을 읽을 수 없어. Worker 주소를 확인해 줘.')}
  if(!response.ok)throw Error(result.error||`연결 오류 (${response.status})`);
  return result;
}
function normalizeBible(b,title){const output=defaultBible(title);if(!b||typeof b!=='object')return output;
  for(const k of ['title','summary','setting'])output[k]=String(b[k]||output[k]).slice(0,k==='title'?100:9000);
  output.characters=Array.isArray(b.characters)?b.characters.slice(0,45).map(v=>({name:String(v.name||'').slice(0,90),role:String(v.role||'').slice(0,140),traits:String(v.traits||'').slice(0,300),relationships:String(v.relationships||'').slice(0,350)})):[];
  for(const k of ['rules','timeline','tensions','unknowns'])output[k]=Array.isArray(b[k])?b[k].map(x=>String(x).slice(0,550)).slice(0,50):[];
  output.sources=Array.isArray(b.sources)?b.sources.filter(x=>urlSafe(x.url)).slice(0,20).map(x=>({title:String(x.title||'참고 자료').slice(0,160),url:urlSafe(x.url)})):[];
  return output;
}

async function readFile(file){if(file.size>8*1024*1024)throw Error(file.name+' 파일은 8MB 이하만 읽을 수 있어.');const lower=file.name.toLowerCase();let content='';
  if(lower.endsWith('.epub')){
    if(!window.JSZip)throw Error('EPUB 읽기 모듈이 아직 로드되지 않았어. 다시 접속해 줘.');
    const z=await JSZip.loadAsync(await file.arrayBuffer());const container=await z.file('META-INF/container.xml')?.async('string');if(!container)throw Error('EPUB 내부 문서 정보를 찾지 못했어.');
    const doc=new DOMParser().parseFromString(container,'application/xml');const root=doc.querySelector('rootfile');const opfPath=root?.getAttribute('full-path');if(!opfPath)throw Error('EPUB 목차 파일이 없어.');
    const opfText=await z.file(opfPath)?.async('string');if(!opfText)throw Error('EPUB 문서를 열 수 없어.');
    const opf=new DOMParser().parseFromString(opfText,'application/xml');const items=[...opf.getElementsByTagName('item')];const itemMap=new Map(items.map(x=>[x.getAttribute('id'),x.getAttribute('href')]));
    const spine=[...opf.getElementsByTagName('itemref')].map(x=>itemMap.get(x.getAttribute('idref'))).filter(Boolean);
    const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
    const paragraphs=[];for(const href of spine.slice(0,300)){
      const path=decodeURIComponent(base+href.split('#')[0]);const part=z.file(path);if(!part)continue;
      const x=new DOMParser().parseFromString(await part.async('string'),'text/html');
      for(const bad of x.querySelectorAll('script,style,nav'))bad.remove();paragraphs.push(x.body?.textContent?.trim()||'');
    }content=paragraphs.join('\n\n');
  }else{
    const ab=await file.arrayBuffer();let utf=new TextDecoder('utf-8').decode(ab);const corrupt=(utf.match(/�/g)||[]).length;if(corrupt>Math.max(3,utf.length*.005)){
      try{const ko=new TextDecoder('euc-kr').decode(ab);if((ko.match(/�/g)||[]).length<corrupt)utf=ko}catch{}
    }
    if(/\.(html?|xhtml)$/.test(lower)){
      const doc=new DOMParser().parseFromString(utf,'text/html');doc.querySelectorAll('script,style,nav').forEach(x=>x.remove());content=doc.body?.textContent||'';
    }else if(lower.endsWith('.json')){
      try{const parsed=JSON.parse(utf);content=typeof parsed==='string'?parsed:JSON.stringify(parsed,null,2)}catch{content=utf}
    }else content=utf;
  }
  return content.replace(/\r\n?/g,'\n').replace(/\n{5,}/g,'\n\n\n').trim();
}

 const r=S.run,w=activeWorld();if(!r||!w){alert('세계관을 저장하고 이야기를 먼저 시작해 줘.');return}
 const sceneHistory=r.history.slice(-14).map(h=>({chapter:h.chapter,action:h.choice,title:h.scene.heading,results:h.scene.consequences,people:h.scene.characterState,unresolved:h.scene.unresolved}));
 const prompt=`[WORLDLINE · ChatGPT 왕복 모드 · ${r.chapter}장]\n너는 원작 고증을 중시하는 한국어 장편 인터랙티브 소설 작가다. 사용자가 행동을 자유롭게 결정하고, 너는 결과를 개연성 있게 이어 쓴다. 아래 세계관 도감과 사건 기억을 반드시 반영하라. 원작의 긴 문장과 대사를 그대로 재현하지 말고 새 장면을 창작하라. 무리한 능력 사용·설정 위반은 실패하거나 비용과 반작용이 있게 하라. 모순이나 부족한 근거는 임의로 확정하지 말고 드러내라. 이전 행동의 파급 효과와 다른 인물들의 독립적 동기를 유지하라. 대사·행동·주변 반응을 포함해 한국어 약 1000~1700자 분량으로 이어 써라. 선택지는 만들지 마라.\n\n제목: ${w.title}\n세계관 도감: ${JSON.stringify(w.bible)}\n사용자/주인공: ${r.player}\n개입 시작 상황: ${r.premise}\n현재 장: ${r.chapter}\n이번에 사용자가 선언한 행동: ${r.choice||'(첫 장면이므로 첫 상황을 제시해)'}\n사건 요약: ${r.recap||'(첫 장)'}\n인물 상태·미해결 사건: ${JSON.stringify(r.continuity||[])}\n최근 선택과 결과: ${JSON.stringify(sceneHistory)}\n그림 스타일은 파스텔 톤의 부드러운 빛과 섬세한 애니풍, 장면에 맞는 다른 구도.\n\n답변은 아래 스키마의 JSON 객체 하나만 반환하고 다른 문장은 쓰지 마. body는 여러 문단의 자연스러운 한국어 서사로 작성하라. 끝내야 하는 상황이 아니라면 ending=false.\n{"heading":"장면 제목","body":"이어지는 장면 본문","recap":"지금까지 인과관계가 반영된 누적 줄거리 요약","ending":false,"consequences":["이번 장면의 변화"],"unresolved":["미해결 복선"],"characterState":["인물의 상태·관계 변화"],"illustrationBrief":"새로운 구도의 해당 장면 일러스트 설명"}`;
 copyBridgeText(prompt,'장면 요청문을 복사했어. ChatGPT에 붙여넣고 답변 JSON을 WORLDLINE에 가져와.');
}
function copyBridgeText(prompt,msg){
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(prompt).then(()=>{updateStatus(msg);alert(msg)}).catch(()=>promptFallback(prompt));}
 else promptFallback(prompt);
}
function manualNext(){
 const r=S.run;
 const action=document.getElementById('wsFreeChoice')?.value?.trim();
 if(!r?.current||!action){alert('먼저 이번 장면에서 할 행동을 입력해 줘.');return}
 const current=r.current;
 r.history.push({chapter:r.chapter,scene:current,choice:action.slice(0,2000)});
 r.recap=`${r.recap||''}\n제${r.chapter}장: ${current.heading}. 사용자 행동: ${action}`.slice(-6500);
 r.chapter++;r.choice=action.slice(0,2000);r.current=null;
 persistStudio();promptForManualScene();show();
}
function promptForImage(){
 const r=S.run,w=activeWorld();if(!r?.current||!w){alert('먼저 생성된 장면이 필요해.');return}
 captureSetup();const prev=(r.visualHistory||[]).slice(-10);
 const variant=currentIllustrations(r).length+1;
 const prompt=`다음 세계관과 장면에 어울리는 새로운 세로형 일러스트 이미지를 생성해 줘.\n화풍: ${S.visualStyle}\n인물 외형: ${S.appearance}\n세계관: ${JSON.stringify({title:w.title,setting:w.bible.setting,characters:w.bible.characters})}\n현재 장면: 제${r.chapter}장 ${r.current.heading}\n상세 상황: ${r.current.body.slice(0,1500)}\n장면 그림 설명: ${r.current.illustrationBrief}\n이번 버전 번호: ${variant}\n이미 사용한 연출: ${JSON.stringify(prev)}\n동일 장면의 중복 그림을 재사용하지 말고, 머리 모양·눈 색·의상 같은 캐릭터 고유 특징은 유지하면서 카메라 각도·몸짓·표정·시간대·배경의 세부를 변화시킨 새 이미지로 만들어. 서정적이고 섬세한 빛과 채색, 세로형 2:3. 내가 제공한 참조 이미지를 그대로 복제하지 마. 그림 설명이 아니라 이미지를 생성해 줘.`;
 copyBridgeText(prompt,'일러스트 요청문을 복사했어. ChatGPT에서 이미지를 만든 뒤 아이패드에 저장하고 WORLDLINE에 불러와.');
}
async function importIllustration(file){
 if(!file||!S.run?.current)return;
 if(file.size>12*1024*1024){alert('12MB 이하 그림만 등록할 수 있어.');return}
 const img=await new Promise((res,rej)=>{const i=new Image();const url=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(url);res(i)};i.onerror=()=>{URL.revokeObjectURL(url);rej(Error('이미지를 열 수 없어.'))};i.src=url});
 const max=1600,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*ratio);c.height=Math.round(img.naturalHeight*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 const data=c.toDataURL('image/png').split(',')[1],r=S.run,chapter=r.chapter,variant=currentIllustrations(r).length+1,key=imageKey(r,chapter,variant);
 await imagePut(key,data);r.illustrations??={};r.illustrations[chapter]??=[];r.illustrations[chapter].push({key,caption:`${r.current.heading} · ChatGPT 그림 ${variant}`,created:new Date().toISOString()});
 r.visualHistory??=[];r.visualHistory.push({chapter,variant,heading:r.current.heading,shot:`사용자 불러온 새로운 일러스트 ${variant}`,prompt:r.current.illustrationBrief.slice(0,160)});
 persistStudio();S.status='ChatGPT 일러스트를 이번 장면에 저장했어.';show();
}
async function styleFileChanged(file){if(!file)return;captureSetup();if(file.size>8*1024*1024){alert('8MB 이하 이미지로 선택해 줘.');return}const image=await createImageBitmap(file);const scale=Math.min(1,720/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);S.styleReference=canvas.toDataURL('image/jpeg',.72);S.styleInfo=`참조 이미지 등록됨 (${canvas.width}×${canvas.height})`;persistStudio();show()}
async function illustrateScene(){const r=S.run,w=activeWorld();if(!r?.current||!w)throw Error('일러스트를 만들 장면이 없어.');if(useBridge()){throw Error('ChatGPT 왕복 모드에서는 위 버튼으로 일러스트 요청문을 복사해 줘.')}if(!hasConfig()){S.tab='settings';show();throw Error('실제 이미지 생성에는 Worker와 OpenAI 이미지 API 연결이 필요해. 설정을 먼저 마쳐 줘.')}if(S.illustrationBusy)return;
 if(!confirm('이번 장면의 새 일러스트를 생성할까? 이미지 생성 API 요금이 청구될 수 있어.'))return;
 S.illustrationBusy=true;S.illustrationStatus='';show();try{
   captureSetup();const chapter=r.chapter,variant=currentIllustrations(r).length+1;
   const recent=(r.visualHistory||[]).slice(-8);const v=await callAI('illustrate',{title:w.title,bible:w.bible,heading:r.current.heading,body:r.current.body.slice(0,2600),illustrationBrief:r.current.illustrationBrief,player:r.player,chapter,variant,style:S.visualStyle,appearance:S.appearance,previous:recent,reference:S.styleReference||''});
   if(!v.image)throw Error('AI가 이미지를 반환하지 않았어.');const key=imageKey(r,chapter,variant);await imagePut(key,v.image);
   if(!r.illustrations)r.illustrations={};if(!r.illustrations[chapter])r.illustrations[chapter]=[];
   r.illustrations[chapter].push({key,caption:r.current.heading,created:new Date().toISOString()});
   r.visualHistory=[...(r.visualHistory||[]),{chapter,variant,heading:r.current.heading,shot:v.shot||'새 구도',prompt:r.current.illustrationBrief.slice(0,160)}].slice(-35);
   persistStudio();S.status=`제${chapter}장 일러스트 ${variant}번 생성 완료.`;
 }finally{S.illustrationBusy=false;show()}}
async function saveImage(key,chapter){const data=await imageGet(key);if(!data){alert('이미지 데이터를 찾지 못했어. 저장 공간이 지워졌을 수 있어.');return}const a=document.createElement('a');a.href='data:image/png;base64,'+data;a.download=`WORLDLINE_${chapter}장_${Date.now()}.png`;document.body.appendChild(a);a.click();a.remove()}
function rewindRun(){const r=S.run;if(!r?.history.length){updateStatus('되돌릴 선택이 없어.');return}const prev=r.history.pop();r.current=prev.scene;r.chapter=prev.chapter;r.choice=r.history.length?r.history[r.history.length-1].choice:'';r.recap=r.history.length?(r.history[r.history.length-1].scene.recap||''):'';persistStudio();show()}
function storyTXT(){const r=S.run;if(!r){alert('진행 중인 이야기가 없어.');return}const w=activeWorld();const a=[`WORLDLINE AI / ${w?.title||''}`,`주인공: ${r.player}`,'',...r.history.flatMap(h=>[`[제${h.chapter}장] ${h.scene.heading}`,h.scene.body,`선택: ${h.choice}`,'']),...(r.current?[`[제${r.chapter}장] ${r.current.heading}`,r.current.body]:[])];download(new Blob([a.join('\n\n')],{type:'text/plain;charset=utf-8'}),'WORLDLINE_AI_이야기.txt')}
function parseChatJSON(input){let data=JSON.parse(input.replace(/```(?:json)?\s*|```/g,'').trim());if(data.bible)data=data.bible;S.bible=normalizeBible(data,S.title||'분석한 세계');S.activeId='';S.tab='knowledge';S.status='ChatGPT 분석 도감을 불러왔어. 수정 후 저장해 줘.';show()}
function chatPrompt(){captureSetup();const b=S.bible||defaultBible(S.title);
 const prompt=`[WORLDLINE 세계관 도감 분석 요청]\n너는 인터랙티브 창작 세계관 분석가다. 다음 작품의 세계관을 정확히 정리해 줘. 만약 이 대화에 TXT/EPUB/PDF 원문 파일을 추가로 첨부했다면 그 자료를 우선으로 읽어. 출처 없이 원문 줄거리를 지어내지 마. 현재 앱에서 자동 복사되는 원문은 일부뿐이므로 원문이 길면 내가 이 대화에 파일을 직접 첨부할 수 있어. 정보 부족·불일치는 unknowns에 넣어 줘. 확실한 원작 설정/2차 자료/나의 추가 설정을 구분해. 원작의 대사나 본문을 길게 재현하지 말고 인물·능력 제약·사건 원인 결과·전개 분기점 등 설정만 구조화해. 가능하면 공개 출처를 확인해 URL을 sources에 기록해.\n\n작품: ${S.title||b.title}\n장르: ${MEDIA_LABEL[S.media]}\n내가 입력한 자료 링크: ${S.links}\n추가 설정 및 바꾸고 싶은 사건: ${S.notes}\n앱에서 복사한 텍본 발췌(전체가 아닐 수 있음): ${S.rawText.slice(0,8500)}\n\n아래 키를 가진 JSON 객체 하나만 반환해.\n{"title":"작품명","summary":"핵심 세계관 및 갈등 요약","setting":"시대/배경/공간","characters":[{"name":"인물명","role":"역할","traits":"성격과 동기","relationships":"관계"}],"rules":["능력·기술·마법 제약"],"timeline":["사건의 시간적 흐름과 인과관계"],"tensions":["갈등 및 복선"],"unknowns":["확인 필요한 점"],"sources":[{"title":"자료명","url":"https://..."}]}`;
 copyBridgeText(prompt,'세계관 분석 요청문을 복사했어. ChatGPT에서 파일을 첨부해 분석하고 JSON 답변을 가져와.');
}
function promptFallback(t){const e=document.createElement('textarea');e.value=t;e.style.cssText='position:fixed;inset:10%;z-index:99999;background:white;color:black;width:80%;height:50%;';document.body.appendChild(e);e.select();alert('요청문을 선택했어. 복사한 다음 ChatGPT에 붙여 넣어 줘.');setTimeout(()=>e.remove(),15000)}
function onClick(e,b){const action=b.dataset.studio;if(!action)return false;
  if(action==='tab'){captureSetup();S.tab=b.dataset.tab||'build';show();return true}
  if(action==='open'){const w=S.worlds.find(w=>w.id===b.dataset.id);if(w){S.activeId=w.id;S.bible=normalizeBible(w.bible,w.title);S.media=w.media;S.title=w.title;S.tab='knowledge';persistStudio();show()}return true}
  if(action==='draft'){offlineBible();return true}
  if(action==='analyze'){captureSetup();withBusy(analyze);return true}
  if(action==='research'){captureSetup();withBusy(research);return true}
  if(action==='save'){if(ensureWorld()){S.status='세계관 저장 완료';show()}return true}
  if(action==='saveplay'){goPlay();return true}
  if(action==='delete'){const w=activeWorld();if(w&&confirm('선택한 세계관을 삭제할까?')){S.worlds=S.worlds.filter(v=>v.id!==w.id);if(S.run?.worldId===w.id)S.run=null;S.activeId='';S.bible=defaultBible();S.tab='build';persistStudio();show()}return true}
  if(action==='connect'){captureSetup();const el=document.getElementById('wsAccess');if(el?.value.trim())accessToken=el.value.trim();if(accessToken)sessionStorage.setItem(ACCESS,accessToken);persistStudio();S.status='연결 설정 저장 완료. 「연결 확인」을 눌러 봐.';show();return true}
  if(action==='ping'){captureSetup();withBusy(async()=>{const url=S.endpoint.trim().replace(/\/$/,'');if(!/^https:\/\//.test(url))throw Error('Worker 주소를 입력해 줘.');const r=await fetch(url+'/health');if(!r.ok)throw Error('서버 상태를 확인할 수 없어.');const data=await r.json();if(!data.configured)throw Error('Worker에서 API 키 또는 접근 암호가 설정되지 않았어.');S.status='Worker 응답 확인 완료. 실제 AI 호출은 분석 시 이루어져.'});return true}
  if(action==='chatprompt'){chatPrompt();return true}
  if(action==='go-settings'){setBibleFromInputs();S.tab='settings';show();return true}
  if(action==='toggle-mode'){S.bridgeMode=!S.bridgeMode;persistStudio();S.status=S.bridgeMode?'ChatGPT 왕복 모드로 바꿨어. 별도 API 호출은 하지 않아.':'자동 API 모드를 선택했어. 서버 연결 및 사용 요금이 필요할 수 있어.';show();return true}
  if(action==='open-chatgpt'){window.open('https://chatgpt.com/','_blank','noopener');return true}
  if(action==='manual-next'){manualNext();return true}
  if(action==='prompt-image'){promptForImage();return true}
  if(action==='importjson'){const input=document.getElementById('wsJSONPaste')?.value?.trim()||'';if(!input){alert('위 칸에 ChatGPT가 반환한 JSON을 먼저 붙여 넣어 줘.');return true}try{parseChatJSON(input)}catch{alert('JSON 형식이 올바르지 않아. 코드블록 대신 JSON 전체를 복사해 줘.')}return true}
  if(action==='start'){captureSetup();withBusy(beginRun);return true}
  if(action==='next'){withBusy(generateScene);return true}
  
  if(action==='freechoice'){const c=document.getElementById('wsFreeChoice')?.value.trim();if(!c){alert('할 행동을 입력해 줘.');return true}withBusy(()=>chooseRun(c.slice(0,2000)));return true}
 if(action==='illustrate'){withBusy(illustrateScene);return true}
 if(action==='save-image'){saveImage(b.dataset.key,Number(b.dataset.chapter)||1);return true}
 if(action==='save-style'){captureSetup();persistStudio();S.status='일러스트 취향을 저장했어.';show();return true}
 if(action==='clear-style'){S.styleReference='';S.styleInfo='참조 이미지를 삭제했어.';persistStudio();show();return true}
 if(action==='prompt-scene'){promptForManualScene();return true}
 if(action==='import-scene'){const raw=document.getElementById('wsScenePaste')?.value?.trim();if(!raw){alert('생성한 장면의 JSON을 붙여 넣어 줘.');return true}try{const result=normalizeScene(JSON.parse(raw.replace(/```(?:json)?\s*|```/g,'')));if(!S.run)throw Error('먼저 이야기를 시작해 줘.');S.run.current=result;S.run.recap=result.recap||S.run.recap;S.run.continuity=[...new Set([...(S.run.continuity||[]),...result.consequences,...result.unresolved,...result.characterState])].slice(-35);persistStudio();S.status='ChatGPT 생성 장면을 적용했어.';show()}catch(ex){alert('JSON을 읽지 못했어: '+ex.message)}return true}
  if(action==='rewind'){rewindRun();return true}
  if(action==='restart'){if(confirm('현재 AI 스토리 기록을 초기화할까?')){S.run=null;persistStudio();show()}return true}
  if(action==='export-story'){storyTXT();return true}
  return false;
}
function onChange(e){if(e.target.id==='wsIllustrationImport'){importIllustration(e.target.files?.[0]).catch(errorNotice);return true}if(e.target.id==='studioFiles'){filesChanged(e.target.files);return true}if(e.target.id==='wsStyleFile'){styleFileChanged(e.target.files?.[0]).catch(errorNotice);return true}return false}
window.WorldlineStudio={render,onClick,onChange,open(){state.screen='studio';S.tab=S.run?'play':'build';show()},get state(){return S}};
if(state.screen==='studio')show();
})();

</script>
<script>
// Version 3.2 deliberately disables the previous offline service worker because
// stale cached versions prevented upgrades on iPad Safari. User story data
// in localStorage / IndexedDB is NOT touched.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (const reg of regs) {
      const u = reg.active?.scriptURL || reg.waiting?.scriptURL || '';
      if (u.includes('/worldline/')) reg.unregister();
    }
  }).catch(()=>{});
}
if ('caches' in window) {
  caches.keys().then(keys => Promise.all(keys.filter(k => /^worldline[\-_]/i.test(k)).map(k => caches.delete(k)))).catch(()=>{});
}
</script>
